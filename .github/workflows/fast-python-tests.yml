# Fast check: the Python CLI's message cleanup (clean_message) against the same cases as the extension,
# so the two implementations can't drift apart. Standard library only: nothing to install.
name: "fast: python tests"

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_postprocess -v
